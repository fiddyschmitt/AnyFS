# =============================================================================
# AnyFS test lab: the one file you edit.
#
# Read by:
#   * Vagrantfile            -> `network:`, `dev_box:`, `accounts:`, `machines:`, `windows:`
#   * ansible/playbook.yml   -> what runs inside the Linux VMs (`linux:`, `accounts:`)
#   * windows/provision.ps1  -> what runs inside the Windows VM (the Vagrantfile passes it its part)
#   * mac.ps1, macos/        -> `mac:` (the macOS VM, which runs on the Mac mini)
#   * tests/AnyFS.TestLab    -> every machine's role, address and login (Lab.cs, for the E2E tests)
#
# After changing a value:
#   memory_mb / cpus / ip    ->  vagrant reload --provision <name>
#   box / box_version        ->  vagrant destroy -f <name>; vagrant up <name>
#   mac:                     ->  .\mac.ps1 reload --provision   (image or mac_address: destroy -f, then up)
#   anything else            ->  vagrant provision <name>
# =============================================================================

# The SSH key every machine accepts; the tests log in with it, and so can you:
#   ssh -i ~/.ssh/anyfs_lab_ed25519 user@192.168.0.95       (Linux)
#   ssh -i ~/.ssh/anyfs_lab_ed25519 vagrant@192.168.0.99    (Windows; PowerShell is the shell)
#   ssh -i ~/.ssh/anyfs_lab_ed25519 admin@192.168.0.98      (the macOS VM)
# Made on first use (by the Vagrantfile or mac.ps1). It lives outside this folder, so it is never
# shared into a VM or committed.
ssh_key: "~/.ssh/anyfs_lab_ed25519"

network:
  # The PC's network adapter the VMs are bridged onto. It's specific to this PC:
  # after a reinstall, `VBoxManage list bridgedifs` shows which one is Up.
  bridge_adapter: "Intel(R) I211 Gigabit Network Connection"

# This PC: it runs the tests and shares two folders into the VirtualBox VMs:
#   publish  provisioning/publish, which .\publish.ps1 fills with the trimmed anyfs per runtime, the
#            fixture generator and the sample plugin: \\vboxsvr\publish (Windows),
#            /media/vboxsf/<ip>/publish (Linux). The tests copy the binaries out of it; the Mac VM
#            gets them over SCP.
#   winfsp   tools/winfsp, the pinned WinFsp installer (scripts/fetch-winfsp.ps1), which the Windows
#            provisioner installs after checking its hash against scripts/winfsp.json.
dev_box:
  ip: 192.168.0.31
  shared_folders:
    publish: "./publish"
    winfsp: "../tools/winfsp"

# The logins the tests use: throwaway values for this lab only.
accounts:
  linux: { user: user, password: anyfs-lab }      # every Linux VM: SSH, sudo, Samba, and sshd for the SSHFS source
  windows: { user: vagrant, password: vagrant }   # the Windows box's own account: SSH, SMB

# The VirtualBox VMs. `role` is how the tests find them:
#   upstream   what anyfs serves from: sshd + the fixture tree (the SSHFS source), a Samba share of
#              the same tree (the Mirror UNC source, from the Windows host); also the remote client
#   host       runs anyfs: every mount provider the OS has; also a local client
# `vagrant up` creates and boots them in this order. Each has a fixed address on the LAN (keep these
# out of the router's DHCP pool). The boxes are pinned so every build is identical: bump them on purpose.
machines:
  - name: anyfs-debian-2
    os: linux
    role: upstream
    ip: 192.168.0.96
    box: bento/debian-13             # Debian 13 "trixie" + VirtualBox Guest Additions
    box_version: "202510.26.0"
    memory_mb: 2048
    cpus: 2

  - name: anyfs-debian-1
    os: linux
    role: host
    ip: 192.168.0.95
    box: bento/debian-13
    box_version: "202510.26.0"
    memory_mb: 3072
    cpus: 2

  - name: anyfs-win11-1              # a Windows computer name: 15 characters at most
    os: windows
    role: host
    ip: 192.168.0.99
    box: gusztavvargadr/windows-11   # Windows 11 25H2 Enterprise (evaluation), OpenSSH included
    box_version: "2607.1.0"
    memory_mb: 6144
    cpus: 2

  # The SharePoint Server farms: three more Windows VMs, off by default because they are heavy (16 GB
  # each farm). `vagrant up anyfs-dc-1 anyfs-sp-1` builds the domain and the Subscription Edition farm,
  # in that order, with the restarts the provisioning needs (well over an hour the first time);
  # `vagrant up anyfs-sp-2` adds the SharePoint 2019 farm the same way, in the same domain. They are not
  # mount hosts: they are what the SharePoint Server source reads from
  # (provisioning/sharepoint/README.md). A sharepoint machine's own fields: `product` (se or 2019),
  # `image` (its installation image in tools/sharepoint), `product_key`, `web_url`, `db_prefix` (its
  # databases' names), and `sql_server` (the machine whose SQL Server it uses; absent: its own).
  - name: anyfs-dc-1                 # Active Directory and DNS for the farm (SharePoint insists on domain accounts)
    os: windows
    role: dc
    autostart: false
    ip: 192.168.0.91
    box: gusztavvargadr/windows-server-2022-standard-core   # Windows Server 2022 Standard, Server Core (evaluation)
    box_version: "2607.0.0"
    memory_mb: 2048
    cpus: 2
    login_user: Administrator        # promotion to a domain controller deletes every other local account

  - name: anyfs-sp-1                 # SQL Server 2022 Developer + SharePoint Server Subscription Edition, one-server farm
    os: windows
    role: sharepoint
    autostart: false
    ip: 192.168.0.92
    box: gusztavvargadr/windows-server-2022-standard        # with the desktop: easier to look at when something is wrong
    box_version: "2607.0.0"
    memory_mb: 16384                 # SharePoint's own minimum for one server; it works on 12288, slowly
    cpus: 4
    product: se
    image: OfficeServer.iso
    product_key: "VW2FM-FN9FT-H22J4-WV9GT-H8VKF"   # Microsoft's published Subscription Edition Enterprise trial key: 180 days
    web_url: "http://anyfs-sp-1"     # the web application: port 80, Windows (NTLM) authentication; also at http://<its ip>
    db_prefix: SP

  - name: anyfs-sp-2                 # SQL Server 2022 Developer + SharePoint Server 2019, one-server farm
    os: windows
    role: sharepoint
    autostart: false
    ip: 192.168.0.90
    box: gusztavvargadr/windows-server-2019-standard        # SharePoint 2019 runs on Windows Server 2016 or 2019 only
    box_version: "1809.0.2407"
    memory_mb: 16384                 # its own SQL Server, so either farm runs without the other (sql_server: anyfs-sp-1 would borrow the first one's)
    cpus: 4
    product: "2019"
    image: OfficeServer2019.iso
    product_key: "M692G-8N2JP-GG8B2-2W2P7-YY7J6"   # Microsoft's published SharePoint Server 2019 Enterprise trial key: 180 days
    web_url: "http://anyfs-sp-2"
    db_prefix: SP2019

  # The Exchange Server: one Mailbox server in the same domain, on a VM of its own as Microsoft asks (never on a
  # domain controller or beside SharePoint). `vagrant up anyfs-dc-1 anyfs-ex-1` builds it (two hours the first
  # time: the prerequisites, Exchange's setup, then the mailboxes). It is what the Outlook source's on-premises
  # store reads from (provisioning/exchange/README.md). Its own field: `image` (the ISO in tools/exchange).
  - name: anyfs-ex-1
    os: windows
    role: exchange
    autostart: false
    ip: 192.168.0.89
    box: gusztavvargadr/windows-server-2022-standard
    box_version: "2607.0.0"
    memory_mb: 12288                 # Exchange asks 8 GB for a Mailbox server at the least; 12 keeps it usable
    cpus: 4
    image: ExchangeServerSE-x64.iso

linux:
  # On the upstream machine: the fixture tree the tests generate there (tests/fixtures/MakeTree), which
  # Samba shares as [fixture] and the SSHFS source serves over sshd.
  fixture_dir: /srv/anyfs/fixture
  # A key pair the provisioning makes on the upstream machine for the SSHFS source to log in with
  # (headless anyfs can't answer a password prompt). The tests copy it to each host.
  sshfs_key: /srv/anyfs/sshfs_key

windows:
  # The RunRemote server (C:\Users\Smith\Desktop\dev\cs\RunRemote): the tests start anyfs through it,
  # inside the logged-on session, where WinFsp's \\anyfs\... and stored SMB credentials live. A
  # self-contained build of the server, shared into the VM; and the client the tests run here.
  runremote_dir: "C:/Users/Smith/Desktop/dev/cs/RunRemote/server/bin/Release/net8.0-windows/win-x64/publish"
  runremote_client: "C:/Users/Smith/Desktop/dev/cs/RunRemote/runremote/bin/Debug/net8.0/runremote.exe"

# The SharePoint Server farms (the machines with role dc and sharepoint). SharePoint insists on domain
# accounts, so the domain controller makes a forest and these accounts in it; both farms use them. Throwaway values for this
# lab only; the passwords meet Active Directory's default complexity rule.
sharepoint:
  domain: anyfs.lab
  netbios: ANYFS
  safe_mode_password: "AnyFS-lab-dsrm-2026!"          # Directory Services Restore Mode; never used in the lab
  accounts:
    setup:  { user: sp_setup, password: "AnyFS-lab-setup-2026!" }   # installs and configures the farm; SQL sysadmin; site owner
    farm:   { user: sp_farm,  password: "AnyFS-lab-farm-2026!" }    # the farm (timer service, databases) and the web application pool
    tester: { user: sp_user,  password: "AnyFS-lab-user-2026!" }    # what the tests sign in as: a member of the test site and its secondary site collection administrator (SharePoint takes file times only from one)
  passphrase: "AnyFS-lab-passphrase-2026!"            # the farms' passphrase (joining servers; unused after the build)
  media: "../tools/sharepoint"                        # the SharePoint and SQL Server ISOs, which scripts/fetch-sharepoint.ps1 downloads; shared into the VMs
  site: "/sites/anyfs"                                # the site collection the tests use, in each farm
  dsc_version: "5.7.1"                                # SharePointDsc, the PowerShell Gallery module that builds the farm

# The Exchange Server (the machine with role exchange) lives in the SharePoint farms' domain. Exchange Server
# Subscription Edition runs as a trial with no product key for 180 days. The domain's Administrator (the dc's
# login) installs it: setup needs a schema, enterprise and domain administrator. Throwaway values for this lab only.
exchange:
  organization: AnyFSLab
  media: "../tools/exchange"                 # the Exchange SE ISO: D:\VMs\media\exchange on this PC, through a junction
  mailboxes:
    tester: { user: ex_user,  password: "AnyFS-lab-mail-2026!" }   # what the tests sign in as: a mailbox with an archive, and the shared mailbox
    other:  { user: ex_other, password: "AnyFS-lab-mail-2026!" }   # a second mailbox: who the seeded mail is from
  shared_mailbox: "Lab Shared"               # a shared mailbox the tester has full access to
  pst_fixtures: "../tests/LibOutlook.Tests/fixtures"   # imported into the tester's mailbox: mail with attachments, a contact, an appointment

# The Mac mini runs the macOS test VM (tart, on Apple's Virtualization framework); only a Mac can.
# Vagrant runs there for it, with the vagrant-tart provider. mac.ps1 drives it from this PC: it copies
# this file and macos/ to the Mac, then runs `vagrant` there over SSH.
mac:
  name: mac-mini-m4
  host: 192.168.0.33
  user: smith
  project_dir: anyfs-lab             # under the user's home on the Mac
  vagrant_tart_version: "1.0.0"      # the Vagrant provider for tart; pinned

  machines:
    - name: anyfs-macos-1
      ip: 192.168.0.98               # the router reserves this address for mac_address
      # tart gives every new VM a random MAC address, and so a new DHCP address. macos/Vagrantfile
      # pins this one instead, so the VM keeps 192.168.0.98 (the rclone lab's VM is ...:24 -> .34).
      mac_address: "96:e4:f4:b3:84:25"
      # macOS 15 Sequoia, pinned by digest (":latest" moves).
      image: "ghcr.io/cirruslabs/macos-sequoia-base@sha256:4947ac5ab1b2fdc46ab856132d2ba958f8e45b5f85192c66370dafc028c514dd"
      user: admin                    # the image's own account
      password: admin
      memory_mb: 6144                # the Mac has 16 GB; the rclone lab's VM must not run at the same time
      cpus: 4
      disk_gb: 50                    # the image's own size: tart can grow a disk, never shrink it
      bridge_interface: en0          # the Mac's LAN interface
